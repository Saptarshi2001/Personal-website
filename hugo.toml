baseURL = "https://saptarshi2001.github.io/personal-website/"
locale = "en-US"
title = "Saptarshi Dutta"
theme = "PaperMod"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[params]
  env = "production"
  author = "Saptarshi Dutta"
  description = "Saptarshi Dutta is a software engineer in Kolkata building developer tools, networked systems, and backend infrastructure."
  keywords = ["Saptarshi Dutta", "software engineer", "backend", "systems programming", "Java", "Python", "TypeScript"]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  mainSections = ["blog"]

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Saptarshi2001"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/saptarshi-dutta-6579641b9/"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:saptarshidutta2001@gmail.com"

[menu]
  [[menu.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 10

  [[menu.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 20

  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/Saptarshi2001"
    weight = 30

[markup]
  [markup.highlight]
    noClasses = false

[caches]
  [caches.images]
    dir = ":cacheDir/images"
