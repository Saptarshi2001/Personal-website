- title: On the Road
  url: https://www.goodreads.com/book/show/70401.On_the_Road
  review: "Possibly a book that has the biggest impact on me. To say it's a book to reread is an understatement in itself. Possibly puts a mirror in front of you of what it means to be alive and free."

- title: After Dark
  url: https://www.goodreads.com/book/show/17803.After_Dark?ref=nav_sb_ss_1_10
  review: "One of Murakami's most trippy and surrealist work I have read. Literally requires a different state of mind to digest the story."

- title: Masters of Doom
  url: https://www.goodreads.com/book/show/222146.Masters_of_Doom?ref=nav_sb_ss_1_15
  review: "The story written about the two guys who created the most iconic software in the history of programming. The parts where the Doom game engine was being made by none other than the master of the game Mr. John Carmack as well as Romero's crazy design philosophy, partly owing to the fact that he was himself a hardcore gamer was probably the best part of the book. Highly recommended to both programmers as well as designers."

- title: City of Thieves
  url: https://www.goodreads.com/book/show/1971304.City_of_Thieves?ref=nav_sb_ss_1_15
  review: "Found this book just when I was in a reading slump. And.. damn what a book. Finished it in two days. Amazing characters, beautiful narrative. Benioff should really write more books."

- title: Dark Matter
  url: https://www.goodreads.com/book/show/27833670-dark-matter?ref=nav_sb_ss_2_7
  review: "Yup!! That new sci-fi series on Apple. I won't give much spoilers over here except to say that I felt really bad for the protagonist over here.. God I hope no one goes through this."

- title: "2001: A Space Odyssey"
  url: https://www.goodreads.com/book/show/70535.2001?ref=nav_sb_ss_1_5
  review: "This was the first Arthur Clarke book I read. The start was amazing, got a little boring in the middle (excluding Hal getting whacked, that was super scary), but I would say, the ending made me quite tripped out."

- title: The Town and the City
  url: https://www.goodreads.com/book/show/154392.The_Town_and_the_City?ref=nav_sb_ss_3_13
  review: "Haven't completed the book and I will say, this is not a book that should be completed. It's rather a book that should be savoured, and enjoyed. Probably Kerouac's most criminally underrated books consisting of characters with so much humanity."

- title: Post Office
  url: https://www.goodreads.com/book/show/40409718-post-office?ref=nav_sb_ss_1_7
  review: "My first Bukowski book and ohh boy was I hooked right from the first para. There's something about Bukowski's writing that signifies what it means when a person is in flow. Never saw such beautiful and captivating writing. Read the book just to know what it means to be a master of the craft."

- title: A Long Way to a Small Angry Planet
  url: https://www.goodreads.com/book/show/22733729-the-long-way-to-a-small-angry-planet?ref=nav_sb_ss_1_16
  review: "A sci-fi book that's dystopian but entertaining. And... finally a sci-fi book that puts an emphasis on the characters rather than making them bland and boring. Presents some amazing ideas around identity, friendship, love and what professions might we have in the future."

- title: Fundamentals of Computer Organization and Architecture
  url: ""
  review: "One of the most beautiful books I have read as a student. Also one of my most favourite subjects in CS :). Gives you a picture in a nice and detailed way of how a computer works."

- title: "Hackers: Heroes of the Computer Revolution"
  url: ""
  review: "First up ... Recommended to LITERALLY any programmer out there. A book that you should keep in your backpack. A book that makes you appreciate all the people who came before us and on whose shoulders we stand today. From the duo of Greenblatt and Gosper to what makes Steve Wozniak STEVE WOZNIAK, it's one of the most thrilling CS books I ever read."
